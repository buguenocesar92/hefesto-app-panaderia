; ---------------------------------------------------------------------------
; Configuracion de PHP para la API de Gestion de Panaderia.
; ---------------------------------------------------------------------------
; Este archivo se monta por encima del que trae la imagen. Solo se escribe lo
; que se quiere cambiar: lo demas queda como lo deje la imagen.

[PHP]
; No se muestran errores en pantalla. Un error de PHP con el detalle en la
; pagina puede mostrar rutas internas y estructura de la base.
display_errors = Off
display_startup_errors = Off

; Los errores van al registro, no a la respuesta.
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limites. Son generosos a proposito: un respaldo grande o un calculo de
; merma sobre muchos lotes no deberian fallar por memoria.
memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 16M
max_execution_time = 120

; Fecha y zona horaria. La zona de Chile es America/Santiago, que tiene cambio
; de hora en el ano. Dejarla en UTC haria que los cortes de dia quedaran
; corridos una hora dos veces al ano, y en un corte de caja eso se nota.
date.timezone = America/Santiago

[opcache]
; Con la vista activa, una consulta que se ejecuta mil veces no compila mil
; veces.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

[Session]
; La sesion va en la base, para poder revocarla desde el servidor si alguien
; pierde el equipo del mostrador.
session.save_handler = files
session.cookie_httponly = 1
session.cookie_samesite = Lax

; En produccion la cookie de sesion tiene que ser SECURE. Va activada en
; `docker-compose.prod.yml` a traves de SESSION_SECURE_COOKIE=true.
session.cookie_secure = 0