events {
    # El archivo de registro del sitio. Es lo que despues permite ver que
    # pidio cada panaderia sin tener que instrumentar el servidor.
    access_log /var/log/nginx/acceso.log;
    error_log  /var/log/nginx/error.log warn;
}

http {
    # `server_tokens off` saca la version de nginx de las cabeceras de
    # respuesta. No es una proteccion fuerte, pero no cuesta nada y evita
    # entregar informacion gratis.
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    client_max_body_size 16m;

    # --- Limitacion de peticiones ---------------------------------------
    # El mostrador no genera tanto trafico como un sitio web, asi que el
    # limite es holgado. Lo que se busca es cortar un bucle de peticiones
    # desde un mismo origen, no limitar a una persona que vende pan.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # --- API -------------------------------------------------------------
    # `php-fpm` escucha en 127.0.0.1:9000. Escucha SOLO en el loopback: si
    # escuchara en 0.0.0.0, el socket de FastCGI quedaria expuesto dentro de
    # la red de contenedores y cualquiera que llegue a el podria ejecutar
    # codigo.
    upstream php {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include fastcgi_params;

            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Parametros que Laravel necesita para saber si la peticion venia
            # por HTTPS. Sin esto, una redireccion de una cookie segura
            # puede salir por HTTP.
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_read_timeout 120;
        }

        # El acceso directo a archivos de PHP que no sea el punto de entrada
        # no se permite. `storage/` y `vendor/` nunca se sirven: dejarlos
        # abiertos es entregar el codigo y los registros.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }

        location ~ ^/(storage|vendor|bootstrap|database)/ {
            deny all;
        }
    }
}