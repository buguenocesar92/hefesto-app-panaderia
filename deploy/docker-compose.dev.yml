# ---------------------------------------------------------------------------
# Desarrollo: cada servicio con su puerto publicado.
# ---------------------------------------------------------------------------
#
# ESTO NO ES PRODUCCION.
# En produccion, el unico que publica puertos es Caddy. Ver
# `docker-compose.prod.yml`.
#
# Aqui los puertos se publican a proposito para poder abrir la API desde el
# navegador durante el desarrollo: sin abrir el puerto, no hay forma de ver
# una respuesta de la API con `curl`.

name: panaderia

services:

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panaderia
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-panaderia_admin}
      # La clave es obligatoria incluso en desarrollo: el motor acepta
      # cualquier conexion cuando la contrasena va vacia.
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
      # El orden de colaboracion de la base. La clave va al principio porque
      # es lo mas comun.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-panaderia_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panaderia_app -d panaderia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - datos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Panadería Hefesto"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_WEB_URL: http://localhost:3000

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: panaderia
      DB_USERNAME: panaderia_app
      DB_PASSWORD: ""

      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-http://localhost:8000/api/v1/acceso/callback}

      # En desarrollo si se corren las migraciones al arrancar. En
      # produccion esto es "false" y se aplican a mano.
      PANADERIA_CORRER_MIGRACIONES: "true"
    ports:
      # Solo en el loopback de la maquina: nadie de la red local llega.
      - "127.0.0.1:8000:9000"
    volumes:
      - ../api:/var/www/html

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # OJO: el nombre del servicio, NO "localhost". Cada contenedor tiene su
      # propio localhost.
      NUXT_API_BASE: http://api:9000
      NUXT_PUBLIC_URL: http://localhost:3000
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # En desarrollo Nuxt lee los archivos al vuelo, asi que no hace falta
      # reconstruir la imagen en cada cambio.
      - ../web:/app
      - nodos-web:/app/node_modules

volumes:
  datos-postgres:
  datos-redis:
  nodos-web: